name: 🐛 Bug Report
description: Report something that isn't working correctly in ReadQuest.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thanks for helping us squash bugs and improve ReadQuest! 📚⚔️

        Please provide as much detail as possible so we can reproduce and fix the problem.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug or problem you encountered.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe what you expected ReadQuest to do instead.
      placeholder: Tell us what you expected to happen...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Tell us exactly what you did before the bug occurred.
      placeholder: |
        1. Open...
        2. Go to...
        3. Tap...
        4. The problem occurs...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: What area of ReadQuest does this relate to?
      options:
        - 📚 Reading
        - ⚔️ Combat
        - 🎒 Inventory
        - 💰 Gold & Loot
        - ⭐ XP & Leveling
        - 🧙 Character
        - 🤖 AI
        - 🎨 UI / Visuals
        - 🗺️ World / Map
        - 📖 Books
        - 🔧 Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How serious is the problem?
      options:
        - 🔴 Critical - App crashes or prevents major functionality
        - 🟠 High - Major feature is broken
        - 🟡 Medium - Feature doesn't work correctly but has a workaround
        - 🟢 Low - Minor issue or visual problem
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ReadQuest Version
      description: What version of ReadQuest are you using?
      placeholder: "Example: v0.5.0-alpha"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using?
      placeholder: "Example: Google Pixel 8"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android Version
      description: What version of Android is your device running?
      placeholder: "Example: Android 16"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video
      description: Attach screenshots or a screen recording if possible.
      placeholder: Drag and drop screenshots or videos here...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else that might help us understand or reproduce the issue?
      placeholder: Add any other information here...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I am using the latest available version of ReadQuest.
          required: true
        - label: I have searched existing issues to make sure this bug hasn't already been reported.
          required: true
        - label: I have provided enough information to reproduce the issue.
          required: true
